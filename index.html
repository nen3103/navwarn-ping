ую потенциальную пользу от предстоящих трехсторонних встреч, встречи между лидерами России и Китая и США."}, {"t": "18:11", "d": "18", "c": ["露"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIB6AXmA7O0fArwiUc2TeI261118.shtml", "ja": "【映像・要約】18日午後、プーチン氏が深圳北理莫斯科大学を訪問し、教員・学生に演説。チェルヌイシェンコ副首相、ゴリコワ副首相、ペスコフ報道官が随行", "o": "【文字起こし・中国語（機械、誤変換を一部修正）】11月18号下午，俄罗斯总统普京访问深圳北理莫斯科大学并向师生发表演讲。这是普京总统的车队抵达校园。普京总统的随行人员陆续抵达了现场。这是俄罗斯副总理切尔内申科。这是俄罗斯副总理戈利科娃。这是俄罗斯总统新闻秘书佩斯科夫。"}, {"t": "18:05", "d": "18", "c": ["露"], "m": "新華社（英語）", "u": "https://english.news.cn/20261118/8522ec1fb7b94fc4a170e55e169bf2d3/c.html", "ja": "習近平氏「中ロ関係は混乱する世界に安定性と確実性をもたらす」（中ロ会見の詳報・英語版）", "o": "Xi says China-Russia relations bring stability, certainty to turbulent world"}, {"t": "18:15", "d": "18", "c": ["韓"], "m": "新華社", "u": "https://www.news.cn/world/20261118/95fe83bb5a8d4fef8a36bd57198bdcac/c.html", "ja": "李在明大統領「貿易障壁を前に開放を止めてはならない」（CEOサミットでの発言、新華社の報道）", "o": "韩国总统李在明：不能在贸易壁垒前停止开放"}, {"t": "18:15", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330527", "ja": "ウシャコフ補佐官「プーチン・トランプ両氏の会談は1回では終わらない。立ち話でも、階段でも、椅子に座っても」", "o": "Ушаков: встреча Путина и Трампа \"будет не одна - на ногах, на ступеньках, в креслах\""}, {"t": "18:24", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330553", "ja": "ウシャコフ補佐官「プーチン・習・トランプの3氏は幅広い問題を話し合う」（19日の3首脳会談について）", "o": "Ушаков: Путин, Си Цзиньпин и Трамп обсудят широкий круг вопросов"}, {"t": "18:26", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330555", "ja": "ウシャコフ補佐官、3首脳会談の主な議題に戦略的安定・核軍縮・中東情勢・ウクライナ和平を挙げる。「第2次大戦中の同盟と国連創設での協力を踏まえて組み立てる」。米ロの最初の非公式接触は今夜の歓迎宴の見通し", "o": "Ушаков назвал тему встречи Путина, Си Цзиньпина и Трампа ／ «Решено построить его контакт лидеров с учетом взаимопонимания и союзничества трех наших стран в ходе Второй мировой войны с упором на сотрудничество наших стран при создании Организации Объединенных Наций»."}, {"t": "18:32", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https:/ 主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。"}, {"t": "19:11", "d": "18", "c": ["米", "露", "日", "韓"], "m": "新華社（英語）", "u": "https://english.news.cn/20261118/0000345a6c5a473fb30524d4610e3b85/c.html", "ja": "【歓迎宴・英語版】習近平主席と彭麗媛夫人が歓迎宴を開く", "o": "SHENZHEN, Nov. 18 (Xinhua) -- Chinese President Xi Jinping and his wife, Peng Liyuan, on Wednesday hosted a banquet in Shenzhen, south China's Guangdong Province, to welcome guests who are here to attend the 33rd Asia-Pacific Economic Cooperation (APEC) Economic Leaders' Meeting."}, {"t": "19:09", "d": "18", "c": ["米"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/0a4e36dfed5048bf9c99336936268887/c.html", "ja": "習近平国家主席、トランプ米大統領を空港で出迎え（再掲）", "o": "习近平迎接美国总统特朗普"}, {"t": "19:14", "d": "18", "c": ["米", "露", "日", "韓"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTILfB63rU2wIFE79qncjeC261118.shtml", "ja": "【歓迎宴】習近平国家主席と彭麗媛夫人が歓迎宴を開く（新華社と同文）", "o": "新华社快讯：11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。"}, {"t": "19:27", "d": "18", "c": ["米", "露", "日", "韓"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/9c71aa0a68a840009e80ae6eb1e9299a/c.html", "ja": "【歓迎宴】宴会の前に、習近平主席夫妻が各エコノミーの首脳・代表・配偶者と集合写真を撮影（第1報、続報待ち）", "o": "新华社深圳11月18日电（记者董雪、梁希之）11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。\n宴会开始前，习近平主席夫妇同各经济体领导人、代表及配偶集体合影。"}, {"t": "19:27", "d": "18", "c": ["米", "露", "日", "韓"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIt4pOjTmKDrNwRJTAKNDD261118.shtml", "ja": "【歓迎宴】宴会前に習近平主席夫妻が各首脳らと集合写真（新華社と同文）", "o": "新华社深圳11月18日电（记者董雪、梁希之）11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。\n宴会开始前，习近平主席夫妇同各经济体领导人、代表及配偶集体合影。"}, {"t": "18:58", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330839", "ja": "ペスコフ大統領報道官：プーチン氏とトランプ氏は今夜（歓迎宴で）顔を合わせ、「きっと言葉を交わすだろう」", "o": "Песков: Путин и Трамп \"наверняка перекинутся фразами\" во время встречи\n（同日配信の関連記事「Песков: Путин и Трамп увидятся вечером」リード：Как отметил представитель Кремля, президенты РФ и США \"наверняка перекинутся фразами\"）"}, {"t": "19:33", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330921", "ja": "【歓迎宴】プーチン氏、APEC首脳の歓迎レセプションでトランプ氏と言葉を交わす（速報）", "o": "Путин пообщался с Трампом на приеме в честь участников саммита АТЭС"}, {"t": "19:35", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330933", "ja": "【歓迎宴】プーチン氏とトランプ氏が握手（速報）", "o": "Путин и Трамп пожали друг другу руки"}, {"t": "19:32", "d": "18", "c": ["米", "露", "日", "韓"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIz0JAzNNntuRmAjYclm90261118.shtml", "ja": "【歓迎宴・映像】CCTV康輝キャスターが開宴前の会場（深圳国際交流中心）を紹介。テーマは「一湾錦繍通亜太」。集合写真の背景は深圳湾の全景。休憩エリアに嶺南の無形文化遺産6点と深圳の科学技術製品15点（計21＝APEC21エコノミー）。宴会場には上海・北京・深圳の3つのAPEC開催都市を描いた長いテーブル", "o": "（動画の文字起こし・機械処理）\n大国外交最前线。大家好,我是康辉。深圳的夜色将至。我从浅海国际会议中心来到了位于乡密湖畔的深圳国际交流中心。今天晚上,习近平主席夫妇在这里要为出席亚太经合组织领导人非正式会议的所有成员经济体的领导人代表举行欢迎宴会。APEC大家庭要在深圳实现首次团聚了。来到深圳就能感受到这真的是一座奇迹之城。今晚的欢迎宴会据说也实时处处有惊奇有惊喜。您知道2008年的时候联合国教科文组织曾经授予深圳设计之都的荣誉吗?而今晚的欢迎宴会就很有设计。设计的理念是一句非常优美的话,叫做一湾锦绣通亚太。那么到底设计理念是如何体现的呢?我们提前到宴会的现场去看一看。APEC大家庭在深圳首次团聚当然要留下第一张全家服。看这就是合影的地方。背景是看向深圳湾的一个全景的视角。高楼林立勾画出了错落有致的城市天际线。而大片的绿色那是中国唯一一个在城市中心区建立的国家级自然保护区。深圳浮田洪树林国家级自然保护区。山海之上城市之美生态之美相得一张,这不就是一湾锦绣吗?而APEC大家庭在这里留下深圳APEC的第一张全家服。这就是一湾锦绣通亚太。这个区域是贵宾们抵达后在合影之前稍是休息的地方。这里布置的岭南国家级的飞移。你看潮秀名副其实的锦绣吧。还有三百亿年历史的广彩词。石湾桃素红丽姐姐高,真的是林郎满目锦绣蒲面。而这边是另一番科技创新的林郎满目锦绣蒲面了。你看这是全球首家超级智能钢琴。贵宾们只要选择具有自己经济体特色的音乐,那么这架钢琴就会自动弹给你听。端起会微笑的杯子尝尝机器人做的咖啡,微笑美口快乐每一天。还可以认识一下创造了百米八秒八三世界纪录的机器人飞人。所以在这里展示的深圳的科技产品一共有15件,而在那边的岭南级国家飞移是6件,你盖得到了吗?15加6等于21,寓意着APEC的21个成员经济体,通过科技人文互联互通,共促繁荣。你看在这里就是这样实现异湾锦绣童雅泰的。走进欢迎宴会的宴会厅,看到这张长长的宴会桌了吗?这桌上的设置最直观的体现了异湾锦绣童雅泰。徐徐铺展开的一幅中国山水长卷,在繁华演映当中一弯流水弯颜穿过。而在这里我们可以看到上海的御源,北京的天潭,深圳的神中通道和洪树林,潮起上海潮距北京潮永深圳。这三座APEC之城也见证了中国之余APEC从参与到推动,再到引领。这就是异湾锦绣通雅泰,相信贵宾们能够充分地感受到,这一弯是雅泰陆海相连的地理扭带,这仅秀是雅泰多元文明的交織共荣,这一通是雅泰大家庭,经贸的互联互通更是人文相通,心领相通。在今晚的欢迎宴会上,习近平主席将发表热情扬议的致辞,大国外交最前线,我们和您一起关注。"}, {"t": "19:44", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330955", "ja": "【米中ロ】ウシャコフ大統領補佐官：ロシアは中国・米国との首脳会談で「カードゲームはしない」。ロシアは三者首脳会談のために来たと述べた", "o": "Ушаков: Россия не будет \"играть в карты\" на саммите с КНР и США\nПомощник российского лидера отметил, что РФ приехала на трехстороннюю встречу на высшем уровне"}, {"t": "19:52", "d": "18", "c": ["米", "露", "日", "韓"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/5c05d7ee35474b478d171442d22327ef/c.html", "ja": "【歓迎宴】習近平主席の乾杯の辞（全文）：「50年の中国を見るなら深圳へ」。1978年に初めて訪れた深圳は小さな漁村だったと回想。開放・イノベーション・協力を強調し、明日の首脳会議で相互開放拡大の措置などを議論すると表明。日米ロ韓など個別国への言及なし", "o": "新华社深圳11月18日电\n在亚太经合组织第三十三次领导人非正式会议欢迎晚宴上的祝酒辞\n（2026年11月18日，深圳）\n中华人民共和国主席　习近平\n各位同事，\n各位来宾，\n女士们，先生们，朋友们：\n大家晚上好！\n今晚，南海之滨灯火璀璨，鹏城深圳秋意盎然。在亚太经合组织第三十三次领导人非正式会议即将召开之际，我谨代表中国政府和中国人民，对各位嘉宾的到来表示热烈欢迎。\n我曾讲过，看千年的中国去西安，看五百年的中国去北京，看一百年的中国去上海。今天，我想对大家说，看五十年的中国就来深圳。\n深圳是一个有大故事的地方。1978年，我第一次到深圳，看到的还是一个小渔村。弹指间40多年过去了，如今这里高楼林立、车水马龙，变化之大可谓沧海桑田。\n开放是深圳与生俱来的基因。从边陲小镇到国际化大都市，从引进外资和技术到积极参与制定国际规则，今天的深圳，贸易联通四海，商旅络绎不绝，成为中国高水平对外开放的窗口。\n创新是深圳的活力所在。从出口加工到自主研发，从“世界工厂”到创新之城，今天的深圳，每年国际专利申请量近2万件，先进制造业和现代服务业比翼齐飞，成为中国集群式创新的前沿。\n合作是深圳的力量之源。“来了就是深圳人。”这座城市以宽广胸怀接纳四面八方的奋斗者，汇聚来自100多个国家和地区的国际化人才，成为中国同各方合作共赢的热土。\n深圳的故事是中国改革开放的缩影。一代代建设者在改革开放中破冰突围、接续奋斗，解放和发展生产力，展现了中国式现代化的万千气象。\n深圳的故事也是亚太合作的成功范例。亚太经济体突破地理限制和观念差异，积极投入区域合作的大舞台，创造了经济快速发展的“亚太奇迹”。\n女士们、先生们、朋友们！\n亚太经合组织成立以来，开放、创新、合作一直是其鲜明标识。从西雅图的初次握手到雁栖湖的历史盛会，从茂物目标的庄严承诺到亚太共同体的宏伟愿景，亚太经合组织始终把握时代脉搏、引领亚太经济一体化进程，助力亚太成为全球经济最具活力的地区和重要增长引擎。\n于道各努力，千里自同风。为了建设亚太共同体，我们跨越山海走到一起。中方担任今年亚太经合组织东道主以来，在16座城市举办了300多场会议和活动，各成员经济体代表逾万人次踊跃参与，为“中国年”收获更多重要成果作出贡献。在明天的领导人会议上，我们将讨论扩大相互开放的举措，探索创新驱动增长的路径，拓展各领域务实合作的机遇，推动更多成果落地。我期待同大家共商亚太合作大计、共襄亚太发展大业。\n现在，我提议，让我们一起举杯，\n为亚太地区的共同繁荣，\n为这次领导人非正式会议圆满成功，\n为各位嘉宾和家人的健康，干杯！"}, {"t": "19:47", "d": "18", "c": ["露"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTISYcfBwjOTolmeJoICz9P261118.shtml", "ja": "【中ロ・映像】習近平主席、プーチン大統領と会見（新華社発表と同内容のテレビ報道。出席は蔡奇・王毅・黄坤明各氏）", "o": "（動画の文字起こし・機械処理）\n11月18日,国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的俄罗斯总统普京。习近平指出,今年是中俄战略协作伙伴关系建立30周年,也是中俄穆林友好合作条约签署25周年。中俄关系既风雨不动安如山,又风雾长疑放眼凉,为变乱交織的世界提供了更多稳定性和确定性,树立了平等相待,相互尊重,重信手艺,合作共赢的新型大国关系典范。面向未来,双方要长保开拓进取的活力,不断发掘新时代中俄关系的潜力和内涵。坚持脚踏实地,深化两国全方位合作,坚定扛起大国应有的责任和担当,引领和推动世界多极化和国际关系民主化。习近平强调,双方要发挥两国政府立法机构、军队、党纪交往机制作用,确保两国元首达成的共识得到有效落实。中俄务实合作兼具相互信任的政治优势,发展振兴的共同目标、互利共赢的底层逻辑,应作优作强现有合作,拱固存量、拓展增量,提供更加稳定、可预期的投资和营商环境,保护好两国企业合法权益。中俄的发展,与亚太的发展紧密相连。亚太经合组织是加强合作的重要平台。中方愿同包括俄方在内的亚太大家庭一道,共谋亚太繁荣发展大计,写手构建亚太共同体。普京表示,热烈祝贺中国共产党20届五中全会成功召开。今年以来,我同习近平主席举行四次着有成效的会晤,推动俄中关系保持良好发展势头。双方高层交往密切,双边贸易额再上新高,各领域务实合作取得长足进展。俄中教育主题棉活动广泛开展,免签政策极大促进两国人员往来。俄方愿同中方加强被靠背战略协作,总结经验、规划未来、深入拓展、贸易、能源、教育等领域合作,扩大人文交流,更好造福两国人民。祝贺中方在深圳成功举办亚太经合组织领导人非正式会议。俄方愿同中方促进亚太地区发展合作,共同推进世界多极化进程,推动构建更加公正合理的全球治理体系,为维护国际关系稳定发挥重要作用。蔡奇、王毅、黄坤明等参加会见。"}, {"t": "19:46", "d": "18", "c": ["露"], "m": "TASS", "u": "https://tass.ru/politika/28330979", "ja": "【中ロ】ペスコフ大統領報道官：プーチン氏は習近平氏に特別軍事作戦地域（ウクライナ）の状況を説明した", "o": "Песков: Путин проинформировал Си Цзиньпина о ситуации в зоне СВО"}, {"t": "19:50", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.com/politics/2220467", "ja": "【米ロ・米中ロ】ウシャコフ補佐官の発言まとめ：プーチン氏とトランプ氏は明日の全体会合とその直後に必ず会う。米ロ会談は少人数形式で大規模な代表団なし。三者会談では第二次大戦での協力や国連創設の経験、大国間関係の在り方を議論。ウィトコフ、クシュナー両氏は欧州で交渉中", "o": "FACTBOX: Russian presidential aide on Putin-Trump contacts, trilateral meeting with Xi\n- \"It has been decided that they will probably also meet during a gala dinner tonight, provided all the leaders attend. They will definitely meet tomorrow, at the APEC summit's plenary session and immediately afterward.\"\n- \"The number of participants will definitely be quite small. There will be no large delegations.\"\n- The three leaders may recall their countries' role in World War II and their participation in shaping the UN system.\n- \"The discussions will focus on how to further develop relations between the major powers...\"\n- US envoys Steve Witkoff and Jared Kushner are evidently conducting negotiations in Europe while keeping an eye on developments in Shenzhen."}, {"t": "19:58", "d": "18", "c": ["米", "露", "日", "韓"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIrsW7RAq0j0XWYl220U7e261118.shtml", "ja": "【歓迎宴】習近平主席の乾杯の辞（全文、新華社と同文）", "o": ""}, {"t": "19:57", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.com/politics/2220481", "ja": "【歓迎宴】プーチン氏、レセプションでトランプ氏と短く言葉を交わす（TASS記者が現場から）。明日はプーチン、トランプ、習近平3氏が会談。トランプ氏の2期を通じて米ロ首脳の対面接触は8回目に", "o": "Russian President Vladimir Putin spoke briefly with US President Donald Trump at a Tuesday evening gala event, a TASS correspondent reports.\nThe reception is being held at the Shenzhen International Exchange Center on behalf of President of the People's Republic of China Xi Jinping in honor of the economic leaders of the APEC Forum.\nTomorrow, Putin, Trump and Xi will hold a meeting. The talks will be the eighth face-to-face contact between the leaders of Russia and the United States across Trump's two presidential terms."}, {"t": "19:54", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330927", "ja": "【米ロ・米中ロ】ペスコフ報道官の発言まとめ：米ロ中首脳会談にロシアは「途方もない期待」はなく、現実的な期待。プーチン・トランプ両氏の本格会談の可能性にも言及（見出しとリードのみ。マレーシア紙The Starは「本格会談は見込み薄」と報道、本文で未確認）", "o": "Возможность полноформатных переговоров Путина и Трампа и позиция Европы. Заявления Пескова\nНевероятных ожиданий у России от предстоящей встречи лидеров России, США и КНР Владимира Путина, Дональда Трампа и Си Цзиньпина нет, они прагматические, указал представитель Кремля"}, {"t": "20:09", "d": "18", "c": ["米", "露", "日", "韓"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/cdee9a9fdee246ae9ef29637591b6d0d/c.html", "ja": "【歓迎宴・写真】新華社が集合写真などの写真ニュースを配信（説明文は既報と同じ）", "o": "11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。\n宴会开始前，习近平主席夫妇同各经济体领导人、代表及配偶集体合影。"}, {"t": "20:25", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331099", "ja": "【歓迎宴・映像】TASSがプーチン大統領の歓迎レセプション出席の映像を配信", "o": "Путин на приеме в честь участников саммита АТЭС. Видеотрансляция"}, {"t": "20:25", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331147", "ja": "【米ロ】歓迎宴でのプーチン・トランプ両氏の接触は1年3カ月ぶりの対面。前回は2025年8月15日のアンカレジ（アラスカ）首脳会談", "o": "ТАСС: встреча Путина и Трампа стала первым очным контактом за год и три месяца\nДо саммита в Шэньчжэне лидеры РФ и США встречались в Анкоридже 15 августа 2025 года"}, {"t": "20:35", "d": "18", "c": ["日", "米", "露"], "m": "聯合ニュース", "u": "https://www.koreancenter.or.kr/", "ja": "【日中・歓迎宴】聯合ニュースが「APEC歓迎晩餐会で記念撮影する中日首脳」「歓迎晩餐会で会った米中ロ首脳」の写真を配信（見出しのみ、写真・元記事は未確認。中国側は高市首相との接触に言及なし）", "o": "APEC 환영 만찬에서 기념 촬영하는 중ㆍ일 정상\nAPEC 환영 만찬에서 만난 미ㆍ중ㆍ러 정상\nAPEC 환영만찬 기념 촬영 마친 정상들"}, {"t": "22:24", "d": "18", "c": ["日"], "m": "ノーカットニュース", "u": "https://www.nocutnews.co.kr/news/6609130", "ja": "【日中・歓迎宴】高市首相が先に習主席に歩み寄って手を差し出し、習主席は薄い笑みで握手に応じた。彭麗媛夫人との記念撮影でも習氏は薄い笑み。昨年11月の関係悪化後初の対面（韓国メディア。中国側は高市氏への言及なし）", "o": "다카이치 총리는 환한 표정으로 먼저 시 주석에게 다가가 손을 내밀었고, 시 주석은 옅은 미소를 띠고 악수에 응했다.\n펑리위안 여사와 함께한 기념사진 촬영에서 다카이치 총리는 밝은 미소를 보였고, 시 주석도 옅은 미소를 지었다.\n두 사람의 만남은 지난해 11월 다카이치 총리의 \"대만 유사시 개입\" 발언에 중국이 강력 반발하며 양국 관계가 얼어붙은 이후 처음이다."}, {"t": "22:24", "d": "18", "c": ["日"], "m": "ファイナンシャルニュース", "u": "https://www.fnnews.com/news/202611182256436213", "ja": "【日中・歓迎宴】高市首相が話しかけたが、習主席はうなずくだけ。中日首脳会談は難しい情勢（韓国メディア）", "o": "다카이치 말 걸었지만 시진핑 고개만 끄덕..중일 정상회담 난망"}, {"t": "22:24", "d": "18", "c": ["米", "露", "日", "韓"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIsuICbAaAqPX2NCjMxqrM261118.shtml", "ja": "【歓迎宴・映像】CCTV独占映像：習近平主席夫妻が歓迎宴を開催、開宴前に各首脳と集合写真（ナレーションは新華社と同内容、首脳名の言及なし）", "o": "（動画の文字起こし・機械処理）\n11月18号,国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会。欢迎出席亚太经合组织第33次领导人非正式会议的原因。宴会开始前,习近平主席夫妇同各经济体领导人代表及配偶及体合影。"}, {"t": "22:16", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331585", "ja": "【中ロ・米中ロ】ウシャコフ補佐官：プーチン・習近平会談でトランプ氏との会合にも言及があった（見出しのみ）", "o": "Ушаков: встреча с Трампом упоминалась на переговорах Путина и Си Цзиньпина"}, {"t": "22:02", "d": "18", "c": ["米", "露", "日", "韓"], "m": "新華社（英語）", "u": "https://english.news.cn/20261118/924eb4cae64a4b85ad08e876efab7c37/c.html", "ja": "【歓迎宴】新華社英語版の更新版：宴会後、習近平主席夫妻は来賓とともに芸術公演を鑑賞した（首脳個別の言及なし）", "o": "Before the banquet, Xi and Peng posed for group photos with leaders and representatives from APEC economies and their spouses.\nAfter the banquet, they joined the guests to watch an artistic performance."}, {"t": "23:04", "d": "18", "c": ["露", "日"], "m": "TASS", "u": "https://tass.ru/politika/28331727", "ja": "【日ロ】ペスコフ報道官：プーチン氏は深圳で日本の首相との会談を予定していない", "o": "Песков: Путин в Шэньчжэне не планирует проводить встречу с премьером Японии"}, {"t": "23:04", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331717", "ja": "【米ロ】ペスコフ報道官：プーチン氏とトランプ氏はAPECでまだ（じっくり）話ができていない（握手・短いあいさつは既報）", "o": "Песков: Путину и Трампу пока не удалось побеседовать на саммите АТЭС"}, {"t": "23:05", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331729", "ja": "【米中ロ】ペスコフ報道官、ロ米中首脳会談の所要時間について説明（見出しのみ）", "o": "Песков рассказал о продолжительности саммита РФ, США и КНР"}, {"t": "23:03", "d": "18", "c": ["米", "露"], "m": "TASS（AP通信の引用）", "u": "https://tass.ru/mezhdunarodnaya-panorama/28331713", "ja": "【米ロ】AP通信：トランプ氏は三者会談に加え、APECの場でプーチン氏との個別会談を開きたい考え", "o": "AP: Трамп планирует отдельную встречу с Путиным на полях АТЭС в Китае\nПо сведениям агентства, американский президент хотел бы устроить двусторонние переговоры с российским лидером в дополнение к уже анонсированной трехсторонней встрече с председателем КНР Си Цзиньпином"}, {"t": "23:07", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331737", "ja": "【米ロ】ペスコフ報道官：19日にプーチン・トランプ両氏の本格的な会談は予定されていない", "o": "Песков: полноформатные переговоры Путина и Трампа 19 ноября не планируются"}, {"t": "23:13", "d": "18", "c": ["露", "日", "韓"], "m": "TASS", "u": "https://tass.ru/politika/28331749", "ja": "【日ロ・韓ロ】ペスコフ報道官：プーチン氏は深圳で韓国・日本の首脳と言葉を交わしていない", "o": "Песков: Путин не общался в Шэньчжэне с лидерами Республики Корея и Японии\nПресс-секретарь российского лидера рассказал об этом журналистам"}, {"t": "23:24", "d": "18", "c": ["露", "米"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/d5ddea231c1f426b82cf5649dbe7277b/c.html", "ja": "【米中ロ・歓迎宴】新華社写真ニュース：宴会前、習近平主席がプーチン大統領、トランプ大統領と交流（中国側が3者の接触を初めて明記）。ほかに乾杯の辞、来賓との記念撮影の写真", "o": "11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。这是习近平发表致辞。\n……这是习近平和彭丽媛同来宾们合影留念。\n……这是宴会前，习近平同俄罗斯总统普京、美国总统特朗普交流。"}, {"t": "23:24", "d": "18", "c": ["米", "露", "日", "韓"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIEmI15NFxvqmbRe92ZL2S261118.shtml", "ja": "【歓迎宴・詳報・映像】習近平主席夫妻、レッドカーペットで到着した各首脳を出迎え、親しく握手して記念撮影。乾杯の辞の要旨、宴会後に芸術公演を鑑賞。出席は蔡奇・王毅・何立峰・黄坤明・王小洪各氏ら（首脳個別の言及なし）", "o": "11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。\n香蜜湖畔，灯火璀璨，国际交流中心奏响亚太经合组织各成员经济体乐曲。\n各成员经济体领导人、代表及配偶，出席会议的国际组织负责人相继抵达，沿红毯前行。\n习近平和彭丽媛热情迎接，同他们亲切握手并合影留念。\n在悠扬的迎宾曲中，习近平和彭丽媛同来宾们共同步入宴会厅。\n习近平发表致辞，代表中国政府和中国人民热烈欢迎各位嘉宾来华出席亚太经合组织第三十三次领导人非正式会议。\n习近平指出，看千年的中国去西安，看五百年的中国去北京，看一百年的中国去上海，看五十年的中国来深圳。开放是深圳与生俱来的基因，创新是深圳的活力所在，合作是深圳的力量之源。深圳的故事是中国改革开放的缩影，也是亚太合作的成功范例。\n习近平强调，亚太经合组织成立以来，开放、创新、合作一直是其鲜明标识。从西雅图的初次握手到雁栖湖的历史盛会，从茂物目标的庄严承诺到亚太共同体的宏伟愿景，亚太经合组织始终把握时代脉搏、引领亚太经济一体化进程，助力亚太成为全球经济最具活力的地区和重要增长引擎。中方担任今年亚太经合组织东道主以来，在16座城市举办了300多场会议和活动，为“中国年”收获更多重要成果作出贡献，期待在明天的领导人会议上同各方共商亚太合作大计、共襄亚太发展大业。\n宴会后，习近平和彭丽媛同来宾们共同观看文艺演出，欣赏亚太文明交相辉映、美美与共的盛景，感受亚太共同体互利共赢、携手同心的和谐交响。\n蔡奇、王毅、何立峰、黄坤明、王小洪等出席活动。\n\n（動画の文字起こし・機械処理）\n11月18号晚,国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会,欢迎出席亚太经合组织第33次领导人非正式会议的来宾。悠阳的营兵曲中,习近平和彭丽媛同来宾们共同顾露宴会听。习近平发表致辞,代表中国政府和中国人民热烈欢迎各位嘉宾来华出席亚太经合组织第33次领导人非正式会议。亚太经合组织始终把握时代脉搏,引领亚太经济一体化进程,助力亚太成为全球经济最具活力的地区和重要增长引擎。中方担任今年亚太经合组织东道主义来,在十六座城市举办了三百多场会议和活动,为中国年收获更多重要成果作出贡献。"}, {"t": "23:26", "d": "18", "c": ["露"], "m": "TASS", "u": "https://tass.ru/politika/28331791", "ja": "【歓迎宴】ペスコフ報道官、習近平氏主催のレセプションを「いつものように」非常に温かいものだったと評価", "o": "Песков оценил прием от имени Си Цзиньпина с участием Путина\nПресс-секретарь президента России назвал встречу очень теплой, \"как всегда\""}, {"t": "23:32", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331815", "ja": "【米ロ】ウシャコフ補佐官：プーチン・トランプ両氏は19日のAPEC全体会合の後に会談する。二国間会談は中身のあるものになると期待", "o": "Ушаков: Путин и Трамп проведут встречу после пленарного заседания саммита АТЭС\nУшаков ожидает, что двусторонняя встреча Путина и Трампа будет содержательной"}, {"t": "23:31", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331811", "ja": "【米中ロ】ペスコフ報道官：ロ米中の三者会談はそれ自体が重要。3首脳が「最も難しい問題を議論する際の対話の手本」を示す", "o": "Песков: трехсторонняя встреча РФ - США - КНР важна сама по себе\nПресс-секретарь президента России подчеркнул, что три лидера важнейших мировых государств собираются вместе, показывая \"пример общения при обсуждении самых сложных вопросов\""}, {"t": "23:34", "d": "18", "c": ["露"], "m": "TASS", "u": "https://tass.ru/politika/28331827", "ja": "【中ロ】ウシャコフ補佐官：プーチン・習近平両氏はアブダビでのウクライナを巡る交渉の話題に触れた。会話は同志的な雰囲気で、国際的な議題を協議、有益だった（中国側発表にウクライナ言及なし）", "o": "Ушаков назвал одну из тем беседы Путина и Си Цзиньпина на саммите АТЭС\nЛидеры России и КНР затрагивали тему переговоров по Украине в Абу-Даби, отметил помощник российского президента\nУшаков: беседа Путина и Си Цзиньпина прошла в товарищеской обстановке\nУшаков: Путин и Си Цзиньпин обсудили вопросы международной повестки\nУшаков назвал полезными переговоры Путина и Си Цзиньпина"}, {"t": "23:33", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331821", "ja": "【米中ロ】プーチン、習近平、トランプの3氏は三者会談の所要時間を自ら決める", "o": "Путин, Си Цзиньпин и Трамп будут сами определять продолжительность встречи"}, {"t": "23:36", "d": "18", "c": ["露"], "m": "TASS", "u": "https://tass.ru/politika/28331837", "ja": "【歓迎宴】ウシャコフ補佐官：プーチン氏は深圳で多くの首脳と「二言三言」言葉を交わした（ペスコフ氏は韓国・日本の首脳とは言葉を交わしていないと説明）", "o": "Ушаков: Путин успел \"перекинуться парой слов\" со многими лидерами в Шэньчжэне"}, {"t": "23:43", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331867", "ja": "【米ロ】プーチン・トランプ会談にはロ米両国の代表団が参加する。ウシャコフ補佐官は双方がすでに準備に入っていると説明（ペスコフ氏は先に「本格会談の予定なし」と説明）", "o": "Во встрече Путина и Трампа примут участие делегации от РФ и США\nУшаков ожидает, что двусторонняя встреча Путина и Трампа будет содержательной. Помощник президента РФ уточнил, что стороны уже готовятся к ней"}, {"t": "23:39", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331847", "ja": "【歓迎宴】ウシャコフ補佐官：プーチン氏とトランプ氏は言葉を交わした", "o": "Ушаков: Путин и Трамп обменялись репликами"}, {"t": "23:45", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331875", "ja": "【歓迎宴】ウシャコフ補佐官：宴会の食卓でプーチン氏とトランプ氏は隣同士ではなかった", "o": "Ушаков: за столом на торжественном приеме Путин и Трамп сидели не рядом"}, {"t": "23:45", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331873", "ja": "【米中ロ】ウシャコフ補佐官：プーチン・トランプ・習近平3氏の会談の代表団は合意済み", "o": "Ушаков: согласованы делегации, которые будут на встрече Путина, Трампа и Си Цзиньпина"}]</script>
<script>
(function () {
  var items = JSON.parse(document.getElementById("feed").textContent);
  items.sort(function (a, b) { return (b.d || "18") + b.t > (a.d || "18") + a.t ? 1 : -1; });
  var list = document.getElementById("list");
  var btns = Array.prototype.slice.call(document.querySelectorAll(".bar button"));
  var current = "";
  var PAGE = 20, limit = PAGE;
  try { limit = Math.max(PAGE, parseInt(sessionStorage.getItem("apec-limit"), 10) || PAGE); } catch (e) {}
  function saveLimit() { try { sessionStorage.setItem("apec-limit", String(limit)); } catch (e) {} }
  var moreBtn = document.getElementById("more");
  try { current = localStorage.getItem("apec-filter") || ""; } catch (e) {}
  function el(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
  function render() {
    list.textContent = "";
    var shown = items.filter(function (it) { return !current || it.c.indexOf(current) >= 0; });
    if (!shown.length) { var e = el("li", "empty", "この国の速報はまだありません。"); list.appendChild(e); }
    var rest = Math.max(0, shown.length - limit);
    shown.slice(0, limit).forEach(function (it) {
      var li = el("li", "item");
      li.appendChild(el("div", "time", (it.d && it.d !== "18" ? it.d + "日 " : "") + it.t));
      var b = el("div", "body");
      var tags = el("div", "tags");
      it.c.forEach(function (c) { tags.appendChild(el("span", "tag " + c, c)); });
      b.appendChild(tags);
      var ja = el("p", "ja", it.ja);
      var a = el("a", null, it.m); a.href = it.u; a.target = "_blank"; a.rel = "noopener";
      ja.appendChild(document.createTextNode("（")); ja.appendChild(a); ja.appendChild(document.createTextNode("）"));
      b.appendChild(ja);
      if (it.o) {
        var det = el("details", "orig");
        det.appendChild(el("summary", null, "原文"));
        det.appendChild(el("p", "o", it.o));
        b.appendChild(det);
      }
      li.appendChild(b);
      list.appendChild(li);
    });
    moreBtn.hidden = rest === 0;
    moreBtn.textContent = "続きを表示する（残り" + rest + "件）";
    btns.forEach(function (bt) {
      var c = bt.getAttribute("data-c");
      bt.setAttribute("aria-pressed", String(c === current));
      bt.querySelector(".n").textContent = c ? items.filter(function (it) { return it.c.indexOf(c) >= 0; }).length : items.length;
    });
  }
  btns.forEach(function (bt) {
    bt.addEventListener("click", function () {
      current = bt.getAttribute("data-c");
      limit = PAGE; saveLimit();
      try { localStorage.setItem("apec-filter", current); } catch (e) {}
      render();
    });
  });
  moreBtn.addEventListener("click", function () { limit += PAGE; saveLimit(); render(); });
  render();
})();
</script>
